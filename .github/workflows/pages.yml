# Publica la demo en GitHub Pages en cada push a main: compila dashboard-prueba y sube dist/.
# La raíz del sitio es demo.html (las tres experiencias en una página); olibia.html, bia.html y sistema.html siguen sueltas.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: dashboard-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-prueba/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cp dist/demo.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-prueba/dist
      - id: deployment
        uses: actions/deploy-pages@v4
